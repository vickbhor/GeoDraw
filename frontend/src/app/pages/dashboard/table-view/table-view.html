<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Type</th>
        <th>Color</th>
        <th>Length / Area</th>
        <th>Coordinates</th>
        <th>Created</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of geoService.items$ | async">
        <td>{{ item.name }}</td>
        <td>{{ item.type }}</td>
        <td><span class="swatch" [style.background]="item.color"></span> {{ item.color }}</td>
        <td>{{ measurementLabel(item) }}</td>
        <td><pre class="coords" [title]="coordinatesText(item)">{{ coordinatesText(item) }}</pre></td>
        <td>{{ item.createdAt | date:'short' }}</td>
      </tr>
    </tbody>
  </table>
</div>
